[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "quantforge"
version = "0.1.0"
description = "Deterministic quantitative research and evidence-based auditing"
requires-python = ">=3.11"
dependencies = ["fastapi==0.162.0", "pydantic==2.14.1", "uvicorn==0.54.0", "tzdata==2026.5"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx2==2.16.0", "pytest-cov==7.1.0", "ruff==0.17.2"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py311"


