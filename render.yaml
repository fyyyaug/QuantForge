# Deploy from the repository root with Render Blueprints.
# Paid service + disk: review Render's estimate before applying this blueprint.
services:
  - type: web
    name: quantforge
    runtime: python
    plan: 0.5c-512mb
    region: ohio
    numInstances: 1
    buildCommand: pip install -r requirements.lock
    startCommand: python -m backend
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: QUANTFORGE_PUBLIC_DEMO
        value: "true"
      - key: QUANTFORGE_COOKIE_SECURE
        value: "true"
      - key: QUANTFORGE_HOST
        value: 0.0.0.0
      - key: QUANTFORGE_DATA_DIR
        value: /var/data/quantforge
    disk:
      name: research-data
      mountPath: /var/data
      sizeGB: 1
